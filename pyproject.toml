[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simscan"
# The version lives in ONE place: simscan/__init__.py:__version__.
# scripts/check_version_consistency.py fails if a literal reappears here.
dynamic = ["version"]
description = "Offline auditor for The Sims 4 Mods folder"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["pillow>=9.0"]

[project.optional-dependencies]
build = ["pyinstaller>=5.0"]
trash = ["send2trash>=1.8"]

[project.scripts]
simscan = "simscan.__main__:main"

[tool.setuptools]
packages = ["simscan"]

[tool.setuptools.dynamic]
version = { attr = "simscan.__version__" }
